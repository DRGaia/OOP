<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Laskin</title>
    <style>
        body {
            font-family: Papyrus, fantasy;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .calculator {
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 4px solid #4CAF50;
            border-right: 4px solid #4CAF50;
            border-radius: 5px;
            text-align: center;
        }
        .result-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 5px;
        }
        .result-value {
            font-size: 24px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Laskin</h1>
        
        <div class="input-group">
            <label for="num1">Ensimmäinen numero:</label>
            <input type="number" id="num1" placeholder="Syötä numero">
        </div>
        
        <div class="input-group">
            <label for="num2">Toinen numero:</label>
            <input type="number" id="num2" placeholder="Syötä numero">
        </div>
        
        <div class="input-group">
            <label for="operation">Operaatio:</label>
            <select id="operation">
                <option value="add">Summa (+)</option>
                <option value="subtract">Erotus (-)</option>
                <option value="multiply">Kertolasku (×)</option>
                <option value="divide">Jakolasku (÷)</option>
            </select>
        </div>
        
        <button id="calcButton">Laske</button>
        
        <div class="result" id="resultDiv" style="display: none;">
            <div class="result-label">Tulos:</div>
            <div class="result-value" id="resultValue">0</div>
            <div style="font-size: 42px;">😊</div>
        </div>
    </div>
    
    <script type="module" src="./build/calculator.js"></script>
</body>
</html>
